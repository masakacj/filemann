name: FileMann

options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"

packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    exactVersion: 4.0.3

targets:
  FileMann:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FileMann
      - path: Shared
    dependencies:
      - package: AMSMB2
        product: AMSMB2
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.filemann
        MARKETING_VERSION: 1.2.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: FileMann/Info.plist
      properties:
        CFBundleDisplayName: FileMann
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: "FileMann 需要访问局域网中的 QNAP WebDAV / SMB NAS 以归档文件。"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleURLTypes:
          - CFBundleURLName: "FileMann Inbox"
            CFBundleURLSchemes:
              - filemann
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  FileMannTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FileMannTests
    dependencies:
      - target: FileMann
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.filemann.tests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES

  FileMannUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FileMannUITests
    dependencies:
      - target: FileMann
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.filemann.uitests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FileMann

schemes:
  FileMann:
    build:
      targets:
        FileMann: all
        FileMannTests: [test]
        FileMannUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - FileMannTests
        - FileMannUITests
