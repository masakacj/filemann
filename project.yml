name: FileMann

options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"

packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    exactVersion: 4.0.3

targets:
  FileMann:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FileMann
      - path: Shared
    dependencies:
      - package: AMSMB2
        product: AMSMB2
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tg.unitgqq2709.tool1
        MARKETING_VERSION: 0.5.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: FileMann/Info.plist
      properties:
        CFBundleDisplayName: FileMann
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "FileMann 需要访问局域网中的 SMB/NAS 以归档文件。"
        NSPhotoLibraryUsageDescription: "FileMann 需要访问你选择的照片和视频，以便导入并按你的设置清理相册原件。"
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleURLTypes:
          - CFBundleURLName: "FileMann Inbox"
            CFBundleURLSchemes:
              - filemann
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
