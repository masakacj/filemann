name: FileMann

options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"

packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    exactVersion: 4.0.3

targets:
  FileMann:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FileMann
      - path: Shared
    dependencies:
      - package: AMSMB2
        product: AMSMB2
        embed: true
      - target: FileMannShare
        embed: true
    preBuildScripts:
      - name: Generate RGB App Icon
        script: |
          set -euo pipefail
          python3 "$SRCROOT/scripts/generate_app_icon.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.filemann
        CODE_SIGN_ENTITLEMENTS: FileMann/FileMann.entitlements
        MARKETING_VERSION: 1.3.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FileMann/Info.plist
      properties:
        CFBundleDisplayName: FileMann
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: "FileMann 需要访问局域网中的 QNAP WebDAV / SMB NAS 以归档文件。"
        NSPhotoLibraryUsageDescription: "FileMann 可读取你选择的相册文件并归档到 NAS，无需长期保存额外副本。"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleURLTypes:
          - CFBundleURLName: "FileMann Inbox"
            CFBundleURLSchemes:
              - filemann
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  FileMannShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FileMannShare
      - path: Shared/FileMannShareGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.filemann.share
        CODE_SIGN_ENTITLEMENTS: FileMannShare/FileMannShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_VERSION: 5.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: FileMannShare/Info.plist
      properties:
        CFBundleDisplayName: "传送到 FileMann"
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 25
              NSExtensionActivationSupportsImageWithMaxCount: 25
              NSExtensionActivationSupportsMovieWithMaxCount: 25

  FileMannTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FileMannTests
    dependencies:
      - target: FileMann
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.filemann.tests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES

  FileMannUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FileMannUITests
    dependencies:
      - target: FileMann
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.filemann.uitests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FileMann

schemes:
  FileMann:
    build:
      targets:
        FileMann: all
        FileMannTests: [test]
        FileMannUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - FileMannTests
        - FileMannUITests
