name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FileMann/**'
      - 'FileMannShare/**'
      - 'Shared/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: write

concurrency:
  group: filemann-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.4"

jobs:
  build:
    name: Build unsigned arm64 IPA
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project FileMann.xcodeproj \
            -scheme FileMann

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          set -o pipefail
          mkdir -p build/logs
          xcodebuild \
            -project FileMann.xcodeproj \
            -scheme FileMann \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build 2>&1 | tee build/logs/xcodebuild.log

      - name: Validate unsigned app
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/DeviceDerivedData/Build/Products/Release-iphoneos/FileMann.app"
          EXECUTABLE="$APP_PATH/FileMann"
          test -d "$APP_PATH"
          test -f "$EXECUTABLE"
          lipo -archs "$EXECUTABLE" | tr ' ' '\n' | grep -qx 'arm64'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = 'com.masakacj.filemann'
          test -f "$APP_PATH/Frameworks/AMSMB2.framework/AMSMB2"
          otool -L "$EXECUTABLE" | grep -q '@rpath/AMSMB2.framework/AMSMB2'
          test ! -e "$APP_PATH/_CodeSignature"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/DeviceDerivedData/Build/Products/Release-iphoneos/FileMann.app"
          PACKAGE_ROOT="$PWD/build/package"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/Payload"
          ditto "$APP_PATH" "$PACKAGE_ROOT/Payload/FileMann.app"
          (
            cd "$PACKAGE_ROOT"
            zip -qry "$PWD/../FileMann-unsigned.ipa" Payload
          )
          test -s "$PWD/build/FileMann-unsigned.ipa"

      - name: Publish latest unsigned IPA
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA="$PWD/build/FileMann-unsigned.ipa"
          test -f "$IPA"

          gh release delete latest \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes || true

          gh release create latest \
            "$IPA#FileMann-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FileMann Latest Unsigned IPA" \
            --notes "Unsigned arm64 iOS build for self-signing. Commit: $GITHUB_SHA · Build: $GITHUB_RUN_NUMBER" \
            --latest

      - name: Upload Xcode build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FileMann-xcodebuild-log
          path: build/logs/xcodebuild.log
          if-no-files-found: warn
          retention-days: 1
